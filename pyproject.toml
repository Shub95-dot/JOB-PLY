[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "job-app-agent"
version = "0.1.0"
description = "Production-grade job application agent for Shubham targeting Data Analytics and Junior Data Science roles."
authors = [
    { name = "Shubham" }
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.18.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
    "src"
]
