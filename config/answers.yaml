# ============================================================================
# Answers to application-form questions. Matched by regex against the question label
# (case-insensitive, first matching rule wins — put specific rules above general ones).
#
#   answer: TODO      -> not answered yet. Any job whose form REQUIRES this question is
#                        sent to assist mode, listing the question, instead of being submitted.
#   answer: "@decline"-> picks "Prefer not to say" / "Decline to self-identify".
#   placeholders      -> {first_name} {last_name} {full_name} {email} {phone} {linkedin}
#                        {github} {portfolio} {location} {city} {cover_letter}
#
# Nothing here is ever generated by AI. If a form asks something not covered, the job
# goes to assist mode and the digest lists the exact question so you can add a rule.
# ============================================================================
rules:
  # ---- eligibility (legal statements — you must fill these in yourself) ----
  - id: graduate_cohort
    patterns: ["are you a .*(2025|2026|2027).*graduate", "graduat\\w* in (2025|2026|2027)"]
    answer: "Yes"            # "Yes" or "No"
  - id: which_university
    patterns: ["what university", "which university", "university .*(attend|studied|study)"]
    answer: "Solent University"
  - id: start_date_commit
    patterns: ["commit to .*start date", "start dates?.*commit"]
    answer: "Yes"            # "Yes" or "No"
  - id: graduate_visa
    patterns: ["graduate visa"]
    answer: "Yes"            # "Yes" or "No"
  - id: sponsorship_graduate_visa_exception
    patterns: ["graduate visa.*(select|answer|choose) no", "if you will be on a graduate visa"]
    answer: "No"
  - id: reasonable_adjustments
    patterns: ["reasonable adjustment"]
    answer: "Yes"            # "Yes" or "No"
  - id: a_level_maths
    patterns: ["a-?level math"]
    answer: "I completed an equivalent Maths course"            # "Yes" or "No"
  - id: sponsorship
    patterns: ["sponsor", "require.*visa", "visa.*requir"]
    answer: "Yes"            # "Yes" or "No"
  - id: right_to_work
    patterns: ["right to work", "eligib\\w* to work", "legally (authori[sz]ed|entitled|permitted)", "work permit", "permission to work"]
    answer: Yes           # "Yes" or "No"
  - id: over_18
    patterns: ["18 years", "over (the age of )?18", "at least 18"]
    answer: "Yes"

  # ---- logistics ----
  - id: notice_period
    patterns: ["notice period", "when (can|could) you start", "earliest (possible )?start", "what is your (earliest )?start date", "availability to start"]
  - id: salary
    patterns: ["salary", "compensation", "pay expectation", "expected pay"]
    answer: "£28,000–£32,000"            # e.g. "£28,000–£32,000"
  - id: relocation
    patterns: ["relocat", "commut", "willing to (work|travel) (from|to|in)", "able to (attend|work from) (the|our) office", "hybrid"]
    answer: "Yes"            # e.g. "Yes"
  - id: current_location
    patterns: ["where are you (currently )?(based|located)", "current location", "^location", "^city", "country of residence"]
    answer: "{Southampton, SO143ZP}"
  - id: driving
    patterns: ["driving licen[cs]e", "full uk licen[cs]e"]
    answer: "No"

  # ---- background ----
  - id: education_level
    patterns: ["highest (level of )?(education|qualification)", "degree level"]
    answer: "Masters"
  - id: university
    patterns: ["^(school|university|institution)( name)?$", "which university"]
    answer: "Solent University"
  - id: degree
    patterns: ["^degree$", "field of study", "discipline", "subject studied"]
    answer: "MSc Artificial Intelligence and Data Science"
  - id: current_company
    patterns: ["current (company|employer)", "^company$", "most recent employer"]
    answer: "KFC"
  - id: current_title
    patterns: ["current (job )?title", "current role"]
    answer: "Team Member"
  - id: years_experience
    patterns: ["years of (relevant |professional )?experience", "how many years"]
    answer: "6 months"            # be honest — e.g. "0" or "Less than 1 year" for analytics roles

  # ---- source / misc ----
  - id: heard_about
    patterns: ["how did you (hear|find|learn)", "where did you (hear|find|see)", "^source$"]
    answer: "Job board"
  - id: previously_employed
    patterns: ["previously (worked|been employed)", "have you ever worked (for|at)", "former employee"]
    answer: "No"
  - id: referral
    patterns: ["referr", "referred by", "know anyone"]
    answer: "No"
  - id: motivation
    patterns: ["why (do )?you want", "why are you interested", "why (this|our) (role|company)", "additional information", "anything else"]
    answer: "{cover_letter}"
  - id: pronouns
    patterns: ["pronoun"]
    answer: "@decline"

  # ---- consent (only ticks boxes whose label matches) ----
  - id: privacy_consent
    patterns: ["privacy (policy|notice)", "data protection", "gdpr", "consent to .*(process|stor)", "i (agree|acknowledge|confirm)"]
    answer: "Yes"
  - id: future_opportunities
    patterns: ["future (opportunities|roles|vacancies)", "talent (pool|community)", "keep (me|my details) on file"]
    answer: "Yes"

  # ---- equal opportunities (UK monitoring) — change any of these if you prefer to answer ----
  - id: gender
    patterns: ["gender", "^sex$", "identify as"]
    answer: "@decline"
  - id: ethnicity
    patterns: ["ethnic", "\\brace\\b"]
    answer: "@decline"
  - id: disability
    patterns: ["disab", "long.?term (health )?condition", "reasonable adjustment"]
    answer: "@decline"
  - id: sexual_orientation
    patterns: ["sexual orientation"]
    answer: "@decline"
  - id: religion
    patterns: ["religio", "belief"]
    answer: "@decline"
  - id: age_range
    patterns: ["age (range|group|bracket)", "date of birth"]
    answer: "@decline"
  - id: veteran
    patterns: ["veteran", "armed forces", "military"]
    answer: "@decline"
  - id: social_mobility
    patterns: ["school did you attend", "parents.*(occupation|university)", "free school meals", "socio"]
    answer: "@decline"
