      action: "Preprocessed customer behavioral logs, performed exploratory data analysis (EDA), built logistic regression and random forest classifiers, and constructed a Power BI tracking dashboard."
      result: "Identified top 3 churn predictors and provided actionable retention strategies to reduce churn by 12%."

