projects:
  - title: "Maternal Health Risk Prediction (Published Research)"
    role: "Lead Researcher & Data Scientist"
    tech_stack: ["Python", "SQL", "Scikit-Learn", "XGBoost", "LightGBM", "SMOTE", "Tableau"]
    star_summary:
      situation: "Clinical risk prediction models often suffer from extreme class imbalance, leading to missed high-risk diagnoses."
      task: "Develop an end-to-end data cleaning, EDA, and predictive machine learning pipeline to accurately classify maternal health risk."
      action: "Engineered robust feature transformation scripts in Python, applied StratifiedKFold cross-validation with SMOTE sampling, and trained a Voting Ensemble (XGBoost + LightGBM + Random Forest)."
      result: "Achieved a 0.889 macro recall score and 0.857–0.858 cross-validated recall. Built an interactive Tableau dashboard to communicate diagnostic risk factors to medical reviewers."

  - title: "SOLiGence Barometer Ensemble System"
    role: "Data Systems Architect"
    tech_stack: ["Python", "LightGBM", "XGBoost", "FastAPI", "Streamlit", "GitHub Actions"]
    star_summary:
      situation: "Financial and economic forecasting models require multi-source data ingestion and real-time sentiment analysis."
      task: "Architect an automated forecasting and sentiment analysis engine with CI/CD deployment."
      action: "Combined BiLSTM, XGBoost, and TCN models using a LightGBM meta-learner with a FinBERT sentiment pipeline; containerized and deployed via FastAPI and Streamlit."
      result: "Reduced forecast error rates by 18% and automated daily pipeline updates via GitHub Actions."

  - title: "Sensorless Markerless Athlete Injury-Risk Screening"
    role: "Biomechanical Data Analyst"
    tech_stack: ["Python", "OpenCV", "MediaPipe", "XAI"]
    star_summary:
      situation: "Traditional motion analysis requires expensive sensor hardware and manual frame annotation."
