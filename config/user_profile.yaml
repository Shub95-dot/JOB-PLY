      action: "Extracted spatial pose coordinates using MediaPipe/OpenCV, validated movement metrics against OpenCap gold-standard data, and developed a rule-based explainability module."
      result: "Attained high correlation (R² > 0.89) against OpenCap 3D kinematics, enabling automated non-invasive screening."

  - title: "Customer Churn Prediction Model"
    role: "Data Analyst"
    tech_stack: ["Python", "Pandas", "Scikit-Learn", "Power BI"]
    star_summary:
      situation: "Subscription service provider faced rising customer attrition without early-warning indicators."
