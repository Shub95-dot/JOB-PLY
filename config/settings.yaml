# Nothing is submitted until this is true. Set it only after checking that
# config/user_profile.yaml and config/answers.yaml are accurate.
profile_reviewed: false

# Your real CV (PDF). This exact file is uploaded to every application.
cv_path: "data/Shubham_Shirodkar_CV.pdf"

apply:
  daily_cap: 15                               # max VERIFIED submissions per day
  min_score: 0.15                             # relevance (0–1) — mainly for RANKING; only drops very poor matches
  headless: false                             # true for scheduled/unattended runs
  delay_between_applications_seconds: [25, 70]
  confirmation_timeout_seconds: 25

follow_up_days: 7

notifications:
  discord:                                    # webhook URL goes in .env as DISCORD_WEBHOOK_URL
    enabled: true
    applied: true                             # one message per verified application
    needs_you: true                           # jobs it couldn't apply to, with the reason
    failed: true                              # submitted but no confirmation page
    summary: true                             # totals at the end of each run
    errors: true                              # a source or the run crashed
    interview_prep: true                      # a prep guide was written
    mention_user_id: ""                       # your Discord user ID to get @-pinged for needs_you/errors

interview_prep:
  enabled: true                               # guide per verified application -> data/interview_prep/

llm:
  model: "claude-sonnet-5"                    # cover letters; needs ANTHROPIC_API_KEY. Template used otherwise.

paths:
  db: "data/tracker.db"
  evidence: "data/evidence"
  digest: "data/digest"
  browser_profile: "data/browser_profile"
